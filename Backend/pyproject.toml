[project]
name = "hellohealth-backend"
version = "1.0.0"
description = "AI-powered symptom analysis API with FastAPI and BART zero-shot classification"
requires-python = ">=3.11"

# ===========================
# Ruff — Linter & Formatter
# (replaces flake8 + isort + black)
# ===========================
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "S",    # flake8-bandit (security)
]
ignore = [
    "S105",  # hardcoded-password-string (false positives in config defaults)
    "S106",  # hardcoded-password-func-arg
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ===========================
# Pytest — Test Runner
# ===========================
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "slow: marks tests that load the ML model (deselect with '-m \"not slow\"')",
]

# ===========================
# Mypy — Type Checker
# ===========================
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false       # start lenient, tighten later
check_untyped_defs = true
ignore_missing_imports = true        # third-party stubs may be missing

# ===========================
# Coverage — Test Coverage
# ===========================
[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "alembic/*"]

[tool.coverage.report]
show_missing = true
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]
